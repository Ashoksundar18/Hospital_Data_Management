name: CI & Governance Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hospital_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do
            echo "Waiting for postgres on 127.0.0.1:5432..."
            sleep 1
          done

      - name: Run Pytest test suite against PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hospital_test_db
          ALLOW_DEV_KEYS: "1"
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: mock-key
          AWS_SECRET_ACCESS_KEY: mock-secret
        run: |
          python -m pytest -v --tb=short 2>&1 | tee pytest_output.log
        continue-on-error: true

      - name: Publish Test Output to Annotations
        if: always()
        run: |
          SUMMARY=$(tail -n 25 pytest_output.log | tr '\r\n' '  ')
          echo "::error title=Pytest Failure::$SUMMARY"

      - name: Assert All Tests Passed
        run: |
          if grep -qE "([1-9][0-9]* failed|ERRORS|CollectionError)" pytest_output.log; then
            echo "Pytest reported test failures or collection errors."
            exit 1
          fi
          if ! grep -qE "([1-9][0-9]* passed)" pytest_output.log; then
            echo "Pytest did not report any passing tests."
            exit 1
          fi
          echo "All tests passed successfully!"
